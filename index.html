<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흙수저에서 건물주까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4DC;--ink:#2B2118;--card:#FFFDF7;--green:#1F8A5B;--gold:#F2B01E;--up:#E5484D;--down:#3B6FE0;--mute:#8A7B6A;--line:#2B2118}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:14px 14px 96px;min-height:100vh}
h1,h2,h3,.j{font-family:'Jua','IBM Plex Sans KR',sans-serif;font-weight:400}
button{font-family:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:3px 4px 0 var(--line);padding:14px;margin-bottom:14px}
.title{text-align:center;padding:18px 0 6px}
.title h1{font-size:34px;line-height:1.15}
.title h1 span{color:var(--green)}
.title p{color:var(--mute);margin-top:6px;font-size:14px}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ch{background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:3px 4px 0 var(--line);padding:10px 8px 12px;text-align:center;transition:transform .08s}
.ch:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}
.ch .nm{font-family:'Jua';font-size:22px;margin-top:2px}
.ch .rl{font-size:12.5px;font-weight:700;color:var(--green)}
.ch .tg{font-size:12px;color:var(--mute);min-height:36px;margin-top:2px}
.ch .pk{font-size:11.5px;background:#FFF0C2;border-radius:8px;padding:4px 6px;margin-top:6px}
.ch .df{font-size:12px;margin-top:6px;letter-spacing:1px}
.how{font-size:13.5px}
.how li{margin-left:18px;margin-bottom:3px}
.hud{display:flex;gap:10px;align-items:center}
.hud .av{flex:none;width:76px;background:#FFE9B8;border:2px solid var(--line);border-radius:14px;overflow:hidden;line-height:0}
.hud .info{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nw{font-family:'Jua';font-size:27px;line-height:1.1}
.sm{font-size:12.5px;color:var(--mute)}
.bar{height:12px;border:2px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 6px,#FFD25E 6px,#FFD25E 12px)}
.bar.danger i{background:var(--up)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;text-align:center}
.stats div{background:#FFF0C2;border-radius:10px;padding:5px 2px;font-size:12px}
.stats b{display:block;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border:1.5px solid var(--line);border-radius:20px;padding:2px 9px;background:#fff;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}
.note{font-size:12.5px;margin-top:6px;background:#FDE8E8;border-radius:8px;padding:5px 8px}
.news{background:#2B2118;color:#FFF4DC}
.news .lb{font-size:11.5px;letter-spacing:.08em;color:var(--gold);font-weight:700}
.news .hl{font-family:'Jua';font-size:19px;margin-top:2px}
.news .sm{color:#C9B99F}
.ev h3{font-size:20px;margin-bottom:4px}
.ev .lb{font-size:11.5px;letter-spacing:.08em;color:var(--green);font-weight:700}
.btn{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14.5px;font-weight:500;box-shadow:2px 3px 0 var(--line)}
.btn:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.res{background:#E6F5EC;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;border:2px solid var(--line);border-radius:10px;background:#fff;padding:6px;font-family:'Jua';font-size:16px}
.tab.on{background:var(--ink);color:#FFF4DC}
.as{border-top:1.5px dashed #D9C9A8;padding:9px 0}
.as:first-of-type{border-top:0;padding-top:0}
.as .nm{font-weight:700}
.as .v{font-family:'Jua';font-size:18px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.mini.two{grid-template-columns:repeat(2,1fr)}
.mb{border:1.5px solid var(--line);border-radius:9px;background:#fff;padding:6px 2px;font-size:12.5px;font-weight:700}
.mb.buy{background:#FFE3E3}.mb.sell{background:#E1EAFD}.mb.go{background:#D8F1E3}
.mb:disabled{opacity:.35}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 14px 14px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.foot .in{max-width:452px;margin:0 auto}
.next{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--green);color:#fff;font-family:'Jua';font-size:20px;padding:12px;box-shadow:3px 4px 0 var(--line)}
.next:disabled{background:#B9AD9A;box-shadow:none}
.next:active:not(:disabled){transform:translate(2px,3px);box-shadow:1px 1px 0 var(--line)}
.end{text-align:center}
.end .big{font-size:30px;line-height:1.2;margin:4px 0}
.end .av{width:150px;margin:0 auto;background:#FFE9B8;border:2px solid var(--line);border-radius:20px;overflow:hidden;line-height:0}
.type{display:inline-block;background:var(--gold);border:2px solid var(--line);border-radius:20px;padding:3px 14px;font-family:'Jua';font-size:17px;margin-top:8px}
.quit{background:none;border:0;color:var(--mute);font-size:12.5px;text-decoration:underline;display:block;margin:0 auto}
svg{max-width:100%;height:auto}
.rk{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13.5px}
.rk .n{font-family:'Jua';width:22px;text-align:center;font-size:16px}
.rk .a{width:26px;height:30px;flex:none;overflow:hidden;line-height:0}
.rk .a svg{width:26px;margin-top:-6px}
.rk .w{flex:1;font-weight:700}
.rk.me{background:#FFF0C2;border-radius:8px;padding:3px 6px;margin:0 -6px}
.rnote{font-size:12.5px;margin-top:6px;background:#EDE7F9;border-radius:8px;padding:5px 8px}
.cd{display:inline-block;min-width:30px;text-align:center;border:2px solid var(--line);border-radius:7px;background:#fff;font-family:'Jua';font-size:18px;padding:5px 4px;margin-right:4px;box-shadow:1px 2px 0 var(--line)}
.cd.bk{background:repeating-linear-gradient(45deg,#E5484D,#E5484D 4px,#F58C8F 4px,#F58C8F 8px);color:transparent}
.share{background:#2B2118;border-radius:22px;padding:10px;margin-bottom:8px;box-shadow:3px 4px 0 #BFA77A}
.share .hd{color:#F2B01E;font-family:'Jua';text-align:center;font-size:15px;letter-spacing:.04em;padding:2px 0 8px}
.share .in{background:var(--card);border-radius:14px;padding:14px;text-align:center}
.share .in .av{width:140px;margin:6px auto 0;border:2px solid var(--line);border-radius:18px;overflow:hidden;line-height:0}
.room{display:flex;gap:8px;align-items:center;margin-top:14px}
.room input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.room label{font-family:'Jua';font-size:16px;flex:none}
.share hr{border:0;border-top:1.5px dashed #D9C9A8;margin:12px 0}
</style>
</head>
<body>
<div id="app"></div>

const R=Math.random, rnd=(a,b)=>a+R()*(b-a), chance=p=>R()<p, pick=a=>a[Math.floor(R()*a.length)];
function gauss(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function fmt(n){n=Math.round(n);const neg=n<0;n=Math.abs(n);let s;
  if(n>=10000){const e=Math.floor(n/10000),m=Math.floor((n%10000)/100)*100;s=e+'억'+(m?' '+m.toLocaleString()+'만':'');}
  else s=n.toLocaleString()+'만';
  return (neg?'-':'')+s;}
function hash32(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;}

function gaussR(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function shuffleR(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

{id:'move',t:'이직 제안',d:'스타트업에서 연락이 왔다. "연봉 25% 더 드릴게요. 대신 저희가 좀… 다이나믹합니다."',c:[

/* ===================== 게임 로직 ===================== */
let S=null, TAB='inv';
const propSum=s=>s.props.reduce((a,p)=>a+p.v,0);
const nw=s=>s.cash+s.stock+s.coin+s.gold+propSum(s)+(s.pension||0)-s.debt;
const TIERS=['반지하','오피스텔','아파트','한강뷰 펜트하우스'];
const tierOf=n=>n>=300000?3:n>=100000?2:n>=10000?1:0;
const RMIX={sh:{s:.35,c:.3,r:.2,g:0},jh:{s:.6,c:.1,r:.2,g:0},jw:{s:.2,c:.05,r:.7,g:0},jy:{s:.2,c:.05,r:.3,g:.35}};
const MILE=[[10000,'순자산 1억을 넘겼다'],[100000,'아파트를 샀다'],[250000,'상가 주인이 됐다'],[GOAL,'꼬마빌딩을 샀다! 먼저 건물주가 됐다']];
const FLAVOR=[['코인 단타로 한몫 챙겼다',.12],['리딩방에 물려서 울상이다',-.12],['회사에서 승진했다',.05],['차를 바꿨다. 통장이 얇아졌다',-.06],['부업이 대박 났다',.1],['전세사기를 당할 뻔했다',-.04]];
function initRivals(s){s.rivals=Object.keys(CH).filter(k=>k!==s.ch).map(k=>{const c=CH[k];return{ch:k,nw:c.cash+c.gold-c.debt,income:c.income,expense:c.expense,ms:0,down:false};});}
function stepRivals(s,r,news){
  s.rivals.forEach(v=>{const m=RMIX[v.ch],nm=CH[v.ch].name,q=s.rr[v.ch],chance=p=>q()<p,rnd=(a,b)=>a+q()*(b-a),pick=a=>a[Math.floor(q()*a.length)];
    const ret=(m.s*r.rs+m.c*r.rc+m.r*r.rr+m.g*r.rg)/100+gaussR(q)*.04;
    if(v.nw>0)v.nw*=1+Math.max(-.6,ret);
    v.income*=1+rnd(.02,.07); v.nw+=v.income-v.expense; if(v.ch==='jw'&&chance(.3))v.nw+=Math.max(600,v.nw*.07);
    if(v.ch==='sh'&&!v.down&&chance(.06+s.turn*.004)){v.down=true;v.nw*=.5;v.income=3000;v.expense=2200;news.push('💥 승훈네 그룹이 부도났다. 승훈이 단톡방에서 조용해졌다.');}
    else if(chance(.14)){const f=pick(FLAVOR);v.nw+=Math.abs(v.nw)*f[1];news.push('💬 '+nm+'이 '+f[0]+'.');}
    let hit=null; while(v.ms<MILE.length&&v.nw>=MILE[v.ms][0]){hit=MILE[v.ms][1];v.ms++;}
    if(hit)news.push('👀 '+nm+'이 '+hit+'.');
  });
}
function ranking(s){return [{ch:s.ch,nw:nw(s),me:true},...s.rivals.map(v=>({ch:v.ch,nw:v.nw}))].sort((a,b)=>b.nw-a.nw);}
const rcard=()=>1+Math.floor(R()*13);
const cval=h=>{let t=0,a=0;h.forEach(r=>{if(r===1){a++;t+=11;}else t+=Math.min(10,r);});while(t>21&&a){t-=10;a--;}return t;};
const cname=r=>r===1?'A':r===11?'J':r===12?'Q':r===13?'K':''+r;
function bjStart(f){const s=S,a=Math.floor(s.cash*f);if(s.bj||s.gb.left<=0||a<10)return;s.cash-=a;s.gb.left--;s.gb.count++;s.gb.msg='';s.bjLast=null;s.bj={bet:a,p:[rcard(),rcard()],d:[rcard(),rcard()]};if(cval(s.bj.p)===21)bjEnd();}
function bjHit(){const b=S.bj;if(!b)return;b.p.push(rcard());if(cval(b.p)>=21)bjEnd();}
function bjEnd(){const s=S,b=s.bj;if(!b)return;const pv=cval(b.p);if(pv<=21)while(cval(b.d)<17)b.d.push(rcard());const dv=cval(b.d);let pay=0,m;
  if(pv>21)m='버스트! '+fmt(b.bet)+'원을 잃었다.';
  else if(pv===21&&b.p.length===2&&!(dv===21&&b.d.length===2)){pay=b.bet*2.5;m='블랙잭!!! 2.5배, '+fmt(pay)+'원을 받았다.';}
  else if(dv>21||pv>dv){pay=b.bet*2;m=(dv>21?'딜러 버스트! ':'승리! ')+fmt(pay)+'원을 받았다.';}
  else if(pv===dv){pay=b.bet;m='무승부. 판돈을 돌려받았다.';}
  else m='딜러 승. '+fmt(b.bet)+'원을 잃었다.';
  s.cash+=pay;s.gb.net+=pay-b.bet;s.gb.win=pay>=b.bet;s.gb.msg='🃏 '+m+' (나 '+pv+' : 딜러 '+dv+')';s.bjLast={p:b.p,d:b.d};s.bj=null;}
function addProp(s,id,paid){const p=PROPS.find(x=>x.id===id),v=p.price*s.reIdx;s.props.push({id,name:p.name,icon:p.icon,v,y:p.y,buy:paid||v});}
function propPrice(s,p){return (p.id==='bld'?p.price:p.price*s.reIdx)*(s.ch==='jw'?.85:1);}

let ROOM='';
function newGame(ch,code){
  const c=CH[ch]; code=(code||'').trim().toUpperCase().slice(0,12);
  const seed=code?'room:'+code:'solo:'+Math.random()+':'+Date.now(), r=rng(seed), keys=Object.keys(REG), tw=keys.reduce((a,k)=>a+REG[k].w,0);
  const plan=[]; for(let i=0;i<YEARS;i++){let x=r()*tw;const reg=keys.find(k=>(x-=REG[k].w)<0)||'flat';const others=keys.filter(k=>k!==reg);
    plan.push({reg,u:r(),alt:others[Math.floor(r()*others.length)],ni:r(),z:[gaussR(r),gaussR(r),gaussR(r),gaussR(r)],ce:r()<.45});}
  const gOrder=shuffleR(G,r), ceOrder=shuffleR(CE[ch],rng(seed+':'+ch)), rr={}; Object.keys(CH).forEach(k=>rr[k]=rng(seed+':rival:'+k));
  S={ch,turn:1,age:25,cash:c.cash,stock:0,coin:0,gold:c.gold,props:[],debt:c.debt,income:c.income,expense:c.expense,
     reIdx:1,flags:{},scams:0,used:{},gauge:ch==='sh'?8:0,collapsed:false,last:null,hist:[],mix:{cash:0,stock:0,coin:0,re:0},over:null,gb:{left:3,count:0,net:0,msg:'',win:null},pension:0,bj:null,bjLast:null,tier:0,code,plan,gOrder,ceOrder,rr};
  S.tier=tierOf(nw(S)); initRivals(S);
  S.hist.push(nw(S)); TAB='inv'; setupTurn(S);
}
function setupTurn(s){
  const P=s.plan[s.turn-1]; s.regime=P.reg;
  const hint=P.u<(s.ch==='jh'?.92:.72)?P.reg:P.alt, nl=REG[hint].news;
  s.news=nl[Math.floor(P.ni*nl.length)];
  const ok=e=>!s.used[e.id]&&e.who!==s.ch&&(!e.when||e.when(s));
  const ce=s.ceOrder.filter(ok), ge=s.gOrder.filter(ok);
  let ev=(ce.length&&(P.ce||!ge.length))?ce[0]:ge[0];
  if(!ev) ev={id:'none',t:'평온한 한 해',d:'별일 없는 한 해다. 투자에 집중하자.',c:[{l:'좋아',f:()=>'무소식이 희소식.'}]};
  s.gb.left=3; s.gb.msg=''; s.gb.win=null; s.bjLast=null;
  s.used[ev.id]=1; s.event=ev; s.eventDone=false; s.result='';
}
function canChoose(s,c){return !(c.n&&s.cash<c.n)&&!(c.ok&&!c.ok(s));}
function choose(i){const s=S,c=s.event.c[i]; if(s.eventDone||!canChoose(s,c))return; s.result=c.f(s); s.eventDone=true;}
function buy(k,f){const a=Math.floor(S.cash*f); if(a<1)return; S.cash-=a; S[k]+=a;}
function sell(k,f){const a=S[k]*f; if(a<=0)return; S[k]-=a; S.cash+=a; if(S[k]<1)S[k]=0;}
function buyProp(id,loan){
  const s=S,p=PROPS.find(x=>x.id===id),price=propPrice(s,p),need=loan?price/2:price;
  if(s.cash<need)return;
  s.cash-=need; if(loan)s.debt+=price/2;
  if(id==='bld'){s.props.push({id,name:p.name,icon:p.icon,v:price,y:p.y});s.hist.push(nw(s));finish('owner');return;}
  addProp(s,id,price);
}
function sellProp(i){const p=S.props[i]; if(!p)return; S.cash+=p.v; S.props.splice(i,1);}
const GAMES=[
 {id:'odd',name:'홀짝',icon:'🎲',p:.48,x:2,win:'홀! 맞혔다.',lose:'짝이 나왔다.'},
 {id:'horse',name:'경마',icon:'🏇',p:.22,x:4,win:'3번 말이 막판 스퍼트로 1등!',lose:'내 말은 중간에 풀을 뜯었다.'},
 {id:'slot',name:'잭팟 슬롯',icon:'🎰',p:.04,x:20,win:'7 7 7 !!! 잭팟이 터졌다!!!',lose:'7 7 🍒… 아깝다(고 생각하게 만드는 게 수법).'}
];
let BET=.1;
function gamble(id,f){
  const s=S,g=GAMES.find(x=>x.id===id),a=Math.floor(s.cash*f); if(s.bj||s.gb.left<=0||a<10)return;
  s.cash-=a; s.gb.left--; s.gb.count++;
  if(chance(g.p)){s.cash+=a*g.x; s.gb.net+=a*(g.x-1); s.gb.win=true; s.gb.msg=g.icon+' '+g.win+' '+fmt(a)+'원이 '+fmt(a*g.x)+'원이 됐다!';}
  else{s.gb.net-=a; s.gb.win=false; s.gb.msg=g.icon+' '+g.lose+' '+fmt(a)+'원을 잃었다.';}
}
function repay(){const a=Math.min(S.cash,S.debt); if(a<=0)return; S.cash-=a; S.debt-=a;}

function nextYear(){
  const s=S; if(!s.eventDone||s.over)return; if(s.bj)bjEnd();
  const g=REG[s.regime], notes=[], before=nw(s);
  const gross=Math.max(1,Math.max(0,s.cash)+s.stock+s.coin+s.gold+propSum(s));
  s.mix.cash+=(Math.max(0,s.cash)+s.gold)/gross; s.mix.stock+=s.stock/gross; s.mix.coin+=s.coin/gross; s.mix.re+=propSum(s)/gross;
  const Z=s.plan[s.turn-1].z, rs=g.s+Z[0]*8, rc=Math.max(-92,g.c+Z[1]*25), rr=g.r+Z[2]*3, rg=g.g+Z[3]*5;
  s.stock*=1+rs/100; s.coin*=1+rc/100; s.gold*=1+rg/100; s.reIdx*=1+rr/100;

  }
  if(s.ch==='jw'&&chance(.3)){const a=Math.round(Math.max(600,nw(s)*.07));s.cash+=a;notes.push('🍀 '+pick(['회사 송년회 경품 1등에 당첨됐다','길에서 주운 복권이 당첨됐다','잊고 있던 우리사주가 올랐다','응모해 둔 공모주가 따상을 쳤다','임장 갔다가 만난 중개사가 알짜 정보를 줬다'])+'. +'+fmt(a)+'원.');}
  if(s.ch==='jy'&&rg>10){inc+=1500;notes.push('금값이 뛰어 가게 매출이 늘었다. +1,500만.');}

function finish(type){

  if(type==='owner') e={k:'owner',t:'건물주 엔딩',m:s.age+'살에 꼬마빌딩 매입 성공! 이제 월세 받으며 산다.',mood:'happy'};

  else if(n>=300000) e={k:'fire',t:'파이어족 엔딩',m:'빌딩은 못 샀지만 이 정도면 조기 은퇴 가능!',mood:'happy'};
  else if(n>=100000) e={k:'home',t:'내 집 마련 엔딩',m:'서울에 번듯한 내 집 한 채. 이만하면 성공한 인생.',mood:'happy'};
  else if(n>=10000) e={k:'normal',t:'평범한 직장인 엔딩',m:'크게 잃지도 크게 벌지도 않았다. 그게 제일 어렵다.',mood:'normal'};

  else e={k:'soil',t:'여전히 흙수저 엔딩',m:'20년을 달렸는데 통장은 제자리. 그래도 건강은 남았다.',mood:'sad'};
  const m=s.mix,t=Math.max(1,m.cash+m.stock+m.coin+m.re);
  const sh={cash:m.cash/t,stock:m.stock/t,coin:m.coin/t,re:m.re/t};
  e.type=s.gb.count>=8?'타짜형 🎲':s.scams>=2?'팔랑귀형 👂':sh.coin>.3?'야수의 심장형 🦁':sh.re>.4?'부동산 불패형 🏠':sh.stock>.4?'정석 장투형 📈':sh.cash>.6?'현금 수호자형 🏦':'분산투자 밸런스형 ⚖️';
  e.nw=n; e.rank=ranking(s); e.place=e.rank.findIndex(x=>x.me)+1; s.tier=tierOf(n); s.over=e;
  try{const key='hsj_best_'+s.ch,b=+localStorage.getItem(key)||-Infinity; if(n>b)localStorage.setItem(key,String(Math.round(n)));}catch(_){}
}

   <li>뉴스는 가끔 틀려. 몰빵은 신중하게!</li>
   <li>급하면 <b>도박</b> 탭도 있어. 한 방 역전… 아니면 한 방에 끝.</li>
   <li>나머지 세 친구도 같이 큰다. <b>순위</b>에서 밀리지 마!</li>
   <li><b>방 코드</b> 대결: 시장은 같고, 이벤트 결과 운과 도박은 각자 달라.</li>
   <li><b>꼬마빌딩(50억)</b>을 사면 승리. 대출 50%를 끼면 25억으로도 가능.</li></ul></div>`;
  return h;
}
function rankHtml(rk){return rk.map((r,i)=>`<div class="rk ${r.me?'me':''}"><span class="n">${['🥇','🥈','🥉','4'][i]}</span><span class="a">${avatar(r.ch)}</span><span class="w">${CH[r.ch].name}${r.me?' (나)':''} <span class="sm" style="font-weight:400">${CH[r.ch].role}</span></span><span class="j">${fmt(r.nw)}</span></div>`).join('');}
function renderGame(){
  const s=S,c=CH[s.ch],n=nw(s),L=s.last;
  const mood=!L?'normal':L.delta>0?'happy':L.delta<-Math.abs(n)*.05?'sad':'normal';
  let h=`<div class="card"><div class="hud"><div class="av">${avatar(s.ch,mood,s.tier)}</div><div class="info">
    <div class="row"><span class="j" style="font-size:18px">${c.name} · ${s.age}살</span><span class="sm">${s.code?'🎟️ '+esc(s.code)+' · ':''}${s.turn} / ${YEARS}년 차</span></div>
    <div class="nw">${fmt(n)}원</div>
    <div class="bar"><i style="width:${Math.max(0,Math.min(100,n/GOAL*100))}%"></i></div>
    <div class="row sm"><span>🏠 ${TIERS[s.tier]} 거주</span><span>목표 50억</span></div></div></div>
    <div class="stats"><div>연수입<b>${fmt(s.income)}</b></div><div>생활비<b>${fmt(s.expense)}</b></div><div>빚<b class="${s.debt>0?'down':''}">${fmt(s.debt)}</b></div></div>`;
  if(s.ch==='sh'&&!s.collapsed) h+=`<div style="margin-top:10px"><div class="row sm"><span>⚠️ 그룹 위기 지수</span><span>${Math.round(s.gauge)}</span></div><div class="bar danger"><i style="width:${Math.min(100,s.gauge)}%"></i></div></div>`;
  if(L){
    const ch=(l,v)=>`<span class="chip">${l} <span class="${v>=0?'up':'down'}">${pct(v)}</span></span>`;
    h+=`<div class="chips"><span class="chip">작년: ${L.regime}</span>${ch('주식',L.rs)}${ch('코인',L.rc)}${ch('부동산',L.rr)}${s.ch==='jy'||s.gold>0?ch('금',L.rg):''}<span class="chip">순자산 <span class="${L.delta>=0?'up':'down'}">${L.delta>=0?'+':''}${fmt(L.delta)}</span></span></div>`;
    L.notes.forEach(t=>h+=`<div class="note">${esc(t)}</div>`);
  }
  h+=`</div>`;
  h+=`<div class="card"><div class="row"><span class="j" style="font-size:17px">🏆 친구들 순위</span><span class="sm">순자산 기준</span></div>${rankHtml(ranking(s))}`;
  if(L)L.rnews.forEach(t=>h+=`<div class="rnote">${esc(t)}</div>`);
  h+=`</div>`;
  h+=`<div class="card news"><div class="lb">올해의 뉴스</div><div class="hl">📰 ${esc(s.news)}</div><div class="sm">${s.ch==='jh'?'업계 사람이라 뉴스 해석이 정확한 편이다.':'뉴스는 가끔 빗나간다.'}</div></div>`;
  const ev=s.event;
  h+=`<div class="card ev"><div class="lb">올해의 이벤트</div><h3>${esc(ev.t)}</h3><p>${esc(T(ev.d,s))}</p>`;
  if(!s.eventDone) ev.c.forEach((c,i)=>{h+=`<button class="btn" data-act="choose" data-i="${i}" ${canChoose(s,c)?'':'disabled'}>${esc(c.l)}${c.sub?`<small>${esc(T(c.sub,s))}</small>`:''}${c.n&&s.cash<c.n?'<small>현금이 부족해</small>':''}</button>`;});
  else h+=`<div class="res">${esc(s.result)}</div>`;
  h+=`</div>`;
  h+=`<div class="card"><div class="tabs"><button class="tab ${TAB==='inv'?'on':''}" data-act="tab" data-t="inv">투자</button><button class="tab ${TAB==='re'?'on':''}" data-act="tab" data-t="re">부동산${s.props.length?' ('+s.props.length+')':''}</button><button class="tab ${TAB==='gb'?'on':''}" data-act="tab" data-t="gb">도박</button></div>`;
  if(TAB==='inv'){
    h+=`<div class="as"><div class="row"><span class="nm">💵 현금 <span class="sm">예금 이자 3%</span></span><span class="v">${fmt(s.cash)}</span></div>
      ${s.debt>0?`<div class="mini two"><button class="mb go" data-act="repay" ${s.cash>=1?'':'disabled'}>빚 갚기 (${fmt(Math.min(s.cash,s.debt))})</button><span class="sm" style="align-self:center;text-align:center">대출 이자 연 5% 안팎</span></div>`:''}</div>`;
    ASSETS.filter(a=>!a.only||a.only===s.ch||s[a.k]>0).forEach(a=>{
      h+=`<div class="as"><div class="row"><span class="nm">${a.icon} ${a.name}${L?` <span class="sm ${L[a.r]>=0?'up':'down'}">작년 ${pct(L[a.r])}</span>`:''}</span><span class="v">${fmt(s[a.k])}</span></div>
      <div class="mini"><button class="mb sell" data-act="sell" data-k="${a.k}" data-f="1" ${s[a.k]>0?'':'disabled'}>전부 팔기</button><button class="mb sell" data-act="sell" data-k="${a.k}" data-f="0.5" ${s[a.k]>0?'':'disabled'}>절반 팔기</button><button class="mb buy" data-act="buy" data-k="${a.k}" data-f="0.5" ${s.cash>=2?'':'disabled'}>절반 사기</button><button class="mb buy" data-act="buy" data-k="${a.k}" data-f="1" ${s.cash>=1?'':'disabled'}>몰빵</button></div></div>`;
    });
    if(s.pension>0)h+=`<div class="as"><div class="row"><span class="nm">🏦 연금저축 <span class="sm">45살까지 못 꺼냄</span></span><span class="v">${fmt(s.pension)}</span></div></div>`;
  }else if(TAB==='gb'){
    const a=Math.floor(s.cash*BET),can=s.gb.left>0&&a>=10&&!s.bj;
    h+=`<div class="row"><span class="nm">🃏 올해 남은 판: ${s.gb.left} / 3</span><span class="sm">누적 <span class="${s.gb.net>=0?'up':'down'}">${s.gb.net>=0?'+':''}${fmt(s.gb.net)}</span></span></div>
    <div class="sm" style="margin:6px 0 4px">판돈 (현금 ${fmt(s.cash)} 중)</div>
    <div class="mini" style="grid-template-columns:repeat(3,1fr)">${[[.1,'10%'],[.5,'절반'],[1,'올인']].map(([f,l])=>`<button class="mb ${BET===f?'go':''}" data-act="bet" data-f="${f}">${l}<br>${fmt(Math.floor(s.cash*f))}</button>`).join('')}</div>`;
    GAMES.forEach(g=>{h+=`<button class="btn" data-act="gamble" data-id="${g.id}" ${can?'':'disabled'}>${g.icon} ${g.name} <b style="float:right">${g.x}배</b><small>당첨 확률 ${Math.round(g.p*100)}%</small></button>`;});
    const cds=(h,hide)=>h.map((r,i)=>`<span class="cd ${hide&&i?'bk':''}">${hide&&i?'?':cname(r)}</span>`).join('');
    if(s.bj){const b=s.bj;
      h+=`<div class="res" style="background:#F3EBDD"><div class="sm">딜러</div><div style="margin:4px 0 8px">${cds(b.d,true)}</div><div class="sm">나 · 합계 ${cval(b.p)} · 판돈 ${fmt(b.bet)}</div><div style="margin:4px 0 8px">${cds(b.p)}</div>
      <div class="mini two"><button class="mb buy" data-act="bjhit">히트 (한 장 더)</button><button class="mb sell" data-act="bjstand">스탠드 (멈춤)</button></div></div>`;
    }else{
      h+=`<button class="btn" data-act="bjstart" ${can?'':'disabled'}>🃏 블랙잭 <b style="float:right">2배 · 블랙잭 2.5배</b><small>직접 플레이. 21에 가깝게, 넘으면 버스트</small></button>`;
      if(s.bjLast)h+=`<div class="res" style="background:#F3EBDD"><div class="sm">딜러 · ${cval(s.bjLast.d)}</div><div style="margin:4px 0 8px">${cds(s.bjLast.d)}</div><div class="sm">나 · ${cval(s.bjLast.p)}</div><div style="margin-top:4px">${cds(s.bjLast.p)}</div></div>`;
    }
    if(s.gb.msg)h+=`<div class="res" style="${s.gb.win?'':'background:#E1EAFD'}">${esc(s.gb.msg)}</div>`;
    h+=`<div class="sm" style="margin-top:8px">어떤 게임이든 길게 하면 하우스가 이긴다. 1년에 세 판까지만.</div>`;
  }else{
    if(L){const r=L.rr,bg=r<=-10?'#E1EAFD':r>=12?'#FDE8E8':'#FFF0C2',tx=r<=-10?'📉 부동산 급락! 가진 사람은 눈물, 현금 쥔 사람에겐 줍줍 기회.':r>=12?'📈 부동산 불장! 호가가 자고 일어나면 오른다.':'부동산 시장은 잠잠한 편.';
      h+=`<div style="background:${bg};border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:13.5px"><b>작년 시세 <span class="${r>=0?'up':'down'}">${pct(r)}</span></b> · ${tx}</div>`;}
    s.props.forEach((p,i)=>{const d=p.v-(p.buy||p.v);h+=`<div class="as"><div class="row"><span class="nm">${p.icon} ${p.name} <span class="sm">보유 · 월세 연 ${fmt(p.v*p.y)}</span></span><span class="v">${fmt(p.v)}</span></div><div class="mini two"><button class="mb sell" data-act="sellprop" data-i="${i}">팔기</button><span class="sm" style="align-self:center;text-align:center">산 가격 대비 <b class="${d>=0?'up':'down'}">${d>=0?'+':''}${fmt(d)}</b></span></div></div>`;});
    PROPS.forEach(p=>{const pr=propPrice(s,p);
      h+=`<div class="as"><div class="row"><span class="nm">${p.icon} ${p.name}${s.ch==='jw'?' <span class="chip" style="font-size:11px">임장 할인 15%</span>':''}${p.id==='bld'?' <span class="sm">← 사면 승리!</span>':` <span class="sm">월세 연 ${fmt(pr*p.y)}</span>${L?` <span class="sm ${L.rr>=0?'up':'down'}">${pct(L.rr)}</span>`:''}`}</span><span class="v">${fmt(pr)}</span></div>
      <div class="mini two"><button class="mb buy" data-act="buyprop" data-id="${p.id}" data-loan="0" ${s.cash>=pr?'':'disabled'}>현금으로 사기</button><button class="mb buy" data-act="buyprop" data-id="${p.id}" data-loan="1" ${s.cash>=pr/2?'':'disabled'}>대출 50% (${fmt(pr/2)} 필요)</button></div></div>`;});
  }
  h+=`</div><button class="quit" data-act="home">처음으로</button>`;
  h+=`<div class="foot"><div class="in"><button class="next" data-act="next" ${s.eventDone?'':'disabled'}>${s.eventDone?(s.turn>=YEARS?'결과 보기 ▶':(s.age+1)+'살로 ▶'):'이벤트를 먼저 골라줘'}</button></div></div>`;
  return h;
}
function chart(hist){
  const W=420,H=150,p=8,mx=Math.max(...hist,1),mn=Math.min(...hist,0),sp=(mx-mn)||1;
  const X=i=>p+i*(W-2*p)/Math.max(1,hist.length-1),Y=v=>H-p-(v-mn)/sp*(H-2*p);
  const pts=hist.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="순자산 그래프"><line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="#D9C9A8" stroke-dasharray="4 4"/><polyline points="${pts}" fill="none" stroke="#1F8A5B" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(hist.length-1)}" cy="${Y(hist[hist.length-1])}" r="5" fill="#F2B01E" stroke="#2B2118" stroke-width="2"/></svg>`;
}
function resultText(){const s=S,e=s.over;return `[흙수저에서 건물주까지]${s.code?' 🎟️ 방 '+s.code:''}\n${CH[s.ch].name}(${CH[s.ch].role}) → ${e.t}\n최종 순자산 ${fmt(e.nw)}원 · ${s.age}살 · 친구 중 ${e.place}등\n투자 성향: ${e.type}`;}
function renderEnd(){
  const s=S,e=s.over,c=CH[s.ch];
  return `<div class="share"><div class="hd">★ 흙수저에서 건물주까지 ★${s.code?'<br>🎟️ 방 코드 '+esc(s.code):''}</div><div class="in">
    <div class="sm">${c.name} · ${c.role} · ${s.age}살</div><div class="j" style="font-size:30px;line-height:1.2">${e.t}</div>
    <div class="av">${avatar(s.ch,e.mood,s.tier)}</div>
    <p style="margin-top:10px;font-size:14px">${esc(e.m)}</p>
    <div class="nw" style="margin-top:8px">${fmt(e.nw)}원</div>
    <div class="type">${e.type}</div>
    <hr><div style="text-align:left">${rankHtml(e.rank)}</div>
    <hr>${chart(s.hist)}<div class="sm">25살 → ${s.age}살 순자산${s.pension>0?' · 연금 '+fmt(s.pension)+' 포함':''}${s.gb.count?' · 도박 '+s.gb.count+'판 '+(s.gb.net>=0?'+':'')+fmt(s.gb.net):''}</div>
  </div></div>
  <p class="sm" style="text-align:center;margin-bottom:14px">📸 위 카드를 캡처해서 단톡방에 올려봐</p>
  <button class="next" data-act="again" style="margin-bottom:10px">${c.name}(으)로 다시 하기</button>
  <button class="btn" data-act="home" style="text-align:center">다른 캐릭터 고르기</button>
  <button class="btn" data-act="copy" style="text-align:center" id="copyBtn">결과 글로 복사하기</button>`;
}
function render(){
  const app=document.getElementById('app');
  app.innerHTML=!S?renderStart():S.over?renderEnd():renderGame();
}
if(typeof document!=='undefined'){
  document.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-act]'); if(!b||b.disabled)return;
    const a=b.dataset.act; let top=false;
    if(a==='start'){const el=document.getElementById('room');ROOM=el?el.value.trim().toUpperCase():'';newGame(b.dataset.ch,ROOM);top=true;}
    else if(a==='choose')choose(+b.dataset.i);
    else if(a==='buy')buy(b.dataset.k,+b.dataset.f);
    else if(a==='sell')sell(b.dataset.k,+b.dataset.f);
    else if(a==='repay')repay();
    else if(a==='bet')BET=+b.dataset.f;
    else if(a==='gamble')gamble(b.dataset.id,BET);
    else if(a==='bjstart')bjStart(BET);
    else if(a==='bjhit')bjHit();
    else if(a==='bjstand')bjEnd();
    else if(a==='tab')TAB=b.dataset.t;
    else if(a==='buyprop'){buyProp(b.dataset.id,b.dataset.loan==='1');top=!!S.over;}
    else if(a==='sellprop')sellProp(+b.dataset.i);
    else if(a==='next'){nextYear();top=true;}
    else if(a==='again'){newGame(S.ch,S.code);top=true;}
    else if(a==='home'){S=null;top=true;}
    else if(a==='copy'){
      const t=resultText();
      try{navigator.clipboard.writeText(t).then(()=>{b.textContent='복사했어!';},()=>{b.textContent='복사가 막혀 있어';});}catch(_){b.textContent='복사가 막혀 있어';}
      return;
    }
    render(); if(top)window.scrollTo(0,0);
  });
  render();
}
if(typeof module!=='undefined')module.exports={bjStart,bjHit,bjEnd,cval,ranking,gamble,newGame,choose,buy,sell,buyProp,sellProp,repay,nextYear,canChoose,nw,avatar,get S(){return S;},PROPS,CH};
</script>
